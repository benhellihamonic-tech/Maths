name: Publier L’Archipel des mathématiques
on:
  push:
    branches: [main]
    paths: [public/**, cloudflare/**, .github/workflows/deploy-archipel.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-archipel-maths
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: 29c23e9ef1f1f235ffec98705e4069e7
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer D1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          cf() {
            printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" |
              curl -q -K - -sS --max-time 25 "$@"
          }
          result=$(cf "$api?name=archipel-maths")
          if ! jq -e '.success' <<<"$result" >/dev/null; then
            jq '{errors}' <<<"$result"
            exit 1
          fi
          id=$(jq -r '.result[] | select(.name == "archipel-maths") | .uuid' <<<"$result")
          if [[ -z "$id" ]]; then
            result=$(cf -X POST -H 'Content-Type: application/json' --data '{"name":"archipel-maths"}' "$api")
            if ! jq -e '.success' <<<"$result" >/dev/null; then
              jq '{errors}' <<<"$result"
              exit 1
            fi
            id=$(jq -er '.result.uuid' <<<"$result")
          fi
          jq --arg id "$id" '.d1_databases[0].database_id=$id' cloudflare/wrangler.template.json > wrangler.json
      - name: Migrer puis publier
        run: |
          npx --yes wrangler@4 d1 migrations apply DB --remote
          npx --yes wrangler@4 deploy
      - name: Vérifier le domaine et la base
        run: |
          set -euo pipefail
          url=https://maths.benhelli.org
          curl -fsS --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 "$url/api/health" | jq -e '.ok and .storage == "d1"'
          curl -fsS "$url/" | grep -q 'Archipel des mathématiques'
          curl -fsS "$url/manifest.webmanifest" | jq -e '.display == "standalone"'
